[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor"
version = "0.1.0"
description = "Agentic security auditor: deterministic scanners + optional LLM remediation guidance, with CLI and web dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.scripts]
audit = "auditor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["auditor*"]

[tool.setuptools.package-data]
auditor = ["knowledge/rules.json"]
